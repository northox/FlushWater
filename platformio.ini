[env:seeed_xiao_esp32c3]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; Equivalent of "USB CDC On Boot: Enabled" in the Arduino IDE. Without these,
; Serial is routed to the GPIO20/21 UART, which is not wired to the USB-C
; connector, and the monitor stays silent.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    knolleary/PubSubClient@^2.8
    ropg/ezTime@^0.8.3

# -----------------------------------------------------------------------------
#  FlushWaterNG — Home Assistant MQTT entities
#
#  Add to configuration.yaml, or include it. Restart HA afterwards.
#  The broker must have a matching login (see src/config.example.h).
# -----------------------------------------------------------------------------

mqtt:
  sensor:
    # Water level in cm. Published on change (>= 2 cm) or every 20 min.
    - name: "Sump Water Level"
      unique_id: flushwater_level
      state_topic: "pool/sumppump/level"
      unit_of_measurement: "cm"
      device_class: distance
      state_class: measurement
      icon: mdi:waves-arrow-up

    # Faults: sensor out of range, pump ineffective, safety hold expired.
    - name: "Sump Last Alert"
      unique_id: flushwater_alert
      state_topic: "pool/sumppump/alert"
      icon: mdi:alert-circle
      value_template: "{{ value[:255] }}"

    # Boot line and 5-minute heartbeat: reset reason, IP, RSSI, heap, uptime.
    # Watch for reset=BROWNOUT — the pump motor sagging a shared supply.
    - name: "Sump Diagnostics"
      unique_id: flushwater_log
      state_topic: "pool/sumppump/log"
      entity_category: diagnostic
      icon: mdi:file-document-outline
      value_template: "{{ value[:255] }}"

  binary_sensor:
    # Retained, so this resolves correctly after an HA or broker restart.
    - name: "Sump Pump Allowed"
      unique_id: flushwater_allowed
      state_topic: "pool/sumppump/status"
      payload_on: "allow"
      payload_off: "inhibit"
      device_class: running
      icon: mdi:water-pump

  switch:
    # Turning this ON publishes "no", which inhibits the pump.
    #
    # IMPORTANT: the controller expires this hold after 30 minutes without a
    # further message and fails OPEN. That is deliberate — a latch that can
    # never be cleared is a flood waiting to happen. If you want the hold to
    # persist, re-publish it (see the automation below).
    - name: "Sump Safety Hold"
      unique_id: flushwater_safety_hold
      command_topic: "pool/sumppump/safe"
      payload_on: "no"
      payload_off: "yes"
      state_topic: "pool/sumppump/safe"
      state_on: "no"
      state_off: "yes"
      optimistic: false
      qos: 1
      retain: false
      icon: mdi:hand-back-right

